[project]
name = "sub-agents-skills"
version = "0.13.3"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0",
    "pytest>=8.0",
    "mypy>=1.17",
    "ruff>=0.13",
    "tomli>=1.1",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# PLR1702 is a preview rule; explicit-preview-rules keeps every other preview
# rule off so a ruff upgrade cannot introduce unrelated failures.
preview = true
explicit-preview-rules = true
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations — type contracts on every function
    "B904",   # raise ... from — keep the causing exception
    "ERA001", # no commented-out code left behind
    "FBT001", # no positional bool parameters
    "FBT002",
    "PGH003", # no blanket type: ignore
    "PGH004", # no blanket noqa
    "PLR0913",# argument count (see max-args below)
    "PLR1702",# nesting depth (see max-nested-blocks below)
    "PT011",  # pytest.raises must not be overly broad
    "RUF100", # no stale noqa
    "S603",   # subprocess call sites must justify themselves
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM117", # nested with — combining requires parenthesized syntax (3.10+)
]

[tool.ruff.lint.pylint]
# Complexity is bounded by nesting depth, not branch or statement count: adding
# a CLI backend grows the flat guard clauses without growing what a reader holds,
# so C901/PLR0912/PLR0915 would fire on healthy growth.
max-nested-blocks = 4
max-args = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Runs on the development interpreter. Python 3.9 support is covered where it is
# observable instead: ruff's target-version rejects newer syntax and the 3.9 CI
# job exercises every script module, so mypy needs no version pin.
strict = true
# strict does not imply this one; it closes the explicit `Any` escape hatch.
disallow_any_explicit = true
files = ["skills/sub-agents/scripts", "scripts", "tests"]
# plugins/runner/** is a byte-identical copy of skills/sub-agents/**. Checking
# both would collide on duplicate module names; sync_plugin.py --check keeps
# the copy honest instead.
exclude = "^plugins/"
mypy_path = "skills/sub-agents/scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
